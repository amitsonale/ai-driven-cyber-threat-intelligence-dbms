<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a111c">
  <title>Threat Intelligence Console</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .connection-dot.partial{background:var(--amber)}
    .evidence-table{min-width:1080px}
    .evidence-context{display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fb1c3;font-size:9px}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Threat Intelligence Console home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 2 27 6v8c0 7.2-4.7 12.4-11 16C9.7 26.4 5 21.2 5 14V6l11-4Z"/><path d="m11 16 3.2 3.2L21 12"/></svg></span>
        <span><strong>Sentinel</strong><small>THREAT INTELLIGENCE</small></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-view="alerts"><span class="nav-icon">◉</span>Alerts<span class="nav-count" id="nav-alert-count">—</span></button>
        <button class="nav-item" data-view="campaigns"><span class="nav-icon">⌁</span>Campaigns</button>
        <button class="nav-item" data-view="indicators"><span class="nav-icon">⌕</span>Indicators</button>
        <button class="nav-item" data-view="assets"><span class="nav-icon">▦</span>Assets</button>
        <button class="nav-item" data-view="evidence"><span class="nav-icon">▤</span>Intel evidence</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card">
          <span class="connection-dot" id="sidebar-dot"></span>
          <div><strong id="sidebar-connection">Connecting</strong><small id="sidebar-databases">PostgreSQL + MongoDB</small></div>
        </div>
        <div class="user-chip"><span class="avatar">AT</span><span><strong>Analyst workspace</strong><small>Local demo</small></span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>Threat Operations</span><span class="crumb-sep">/</span><strong id="current-section">Overview</strong></div>
        <div class="topbar-actions"><span class="live-label"><i></i> LOCAL CONSOLE</span><button class="icon-button" id="refresh-button" title="Refresh data" aria-label="Refresh data">↻</button></div>
      </header>

      <div id="connection-banner" class="connection-banner hidden" role="status"></div>
      <section id="view-root" aria-live="polite">
        <div class="loading-state"><span class="spinner"></span><span>Loading threat data…</span></div>
      </section>
      <footer class="app-footer"><span>AI-Driven Cyber Threat Intelligence &amp; Attack Campaign Correlation System</span><span>PostgreSQL + MongoDB · Local application</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
